<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiku Bistro | Reservierung verwalten</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="styles.css?v=20260518-2" />
  </head>
  <body class="guest-page">
    <header class="site-header">
      <div class="container header-inner">
        <a class="header-address" href="index.html">
          <span>Kiku Bistro</span>
          <span>Reservierung</span>
        </a>
        <a class="header-brand" href="index.html" aria-label="Kiku Bistro">
          <img src="assets/header-flower.png?v=20260428-1" alt="" />
        </a>
        <nav class="nav">
          <a href="index.html">Website</a>
          <a href="index.html#reservierung">Reservieren</a>
        </nav>
      </div>
    </header>

    <main class="guest-main">
      <section class="container guest-hero">
        <div>
          <p class="eyebrow">Reservierung</p>
          <h1>Reservierung verwalten</h1>
        </div>
        <p>Hier können Sie Ihre Reservierung ansehen, die Uhrzeit anpassen oder stornieren.</p>
      </section>

      <section class="container guest-shell">
        <div id="guest-content">
          <p class="admin-muted">Reservierung wird geladen...</p>
        </div>
      </section>
    </main>

    <script>
      const content = document.getElementById("guest-content");
      const token = new URLSearchParams(location.search).get("token") || "";
      const slots = ["09:30", "10:00", "11:00", "13:00", "17:00", "18:00"];
      const statusLabels = {
        pending: "Anfrage",
        confirmed: "Bestätigt",
        seated: "Gast da",
        cancelled: "Storniert",
        no_show: "Nicht gekommen",
      };
      const toLocalDate = (date) => {
        const offset = date.getTimezoneOffset();
        return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 10);
      };
      const escapeHtml = (value) =>
        String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      const api = async (url, options = {}) => {
        const response = await fetch(url, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error((data.errors || ["Fehler"]).join(" "));
        return data;
      };

      const renderTimeTiles = (selectedTime, disabled) =>
        slots
          .map(
            (slot) => `
              <button class="time-tile guest-time-tile ${slot === selectedTime ? "selected" : ""}" type="button" data-time="${slot}" ${disabled ? "disabled" : ""} aria-pressed="${slot === selectedTime}">
                <span class="time-tile-hour">${slot}</span>
              </button>
            `
          )
          .join("");

      const render = (reservation, message = "") => {
        const disabled = ["cancelled", "no_show"].includes(reservation.status);
        const status = statusLabels[reservation.status] || reservation.status;
        content.innerHTML = `
          <div class="guest-card">
            <div class="guest-summary">
              <div>
                <span class="guest-status ${reservation.status}">${escapeHtml(status)}</span>
                <h2>${escapeHtml(reservation.date)} um ${escapeHtml(reservation.time)} Uhr</h2>
                <p>${escapeHtml(reservation.guests)} Personen · ${escapeHtml(reservation.name)}</p>
              </div>
            </div>

            <form id="guest-change-form" class="guest-form">
              <input type="hidden" name="time" value="${escapeHtml(reservation.time)}" />
              <div class="form-row form-row-two">
                <label><span>Datum</span><input type="date" name="date" value="${escapeHtml(reservation.date)}" min="${toLocalDate(new Date())}" ${disabled ? "disabled" : ""} required /></label>
                <label><span>Personen</span><input type="number" name="guests" min="1" max="12" value="${escapeHtml(reservation.guests)}" ${disabled ? "disabled" : ""} required /></label>
              </div>
              <div class="guest-time-block">
                <span class="guest-label">Uhrzeit</span>
                <div class="time-grid">${renderTimeTiles(reservation.time, disabled)}</div>
              </div>
              <label><span>Notiz</span><textarea name="note" rows="3" ${disabled ? "disabled" : ""}>${escapeHtml(reservation.note)}</textarea></label>
              <div class="guest-actions">
                <button class="btn btn-dark" type="submit" ${disabled ? "disabled" : ""}>Änderung speichern</button>
                <button class="btn btn-outline" type="button" id="guest-cancel" ${disabled ? "disabled" : ""}>Reservierung stornieren</button>
              </div>
              <p class="reservation-message" id="guest-message" data-type="${message ? "success" : ""}">${escapeHtml(message)}</p>
            </form>
          </div>
        `;
        document.querySelectorAll(".guest-time-tile").forEach((button) => {
          button.addEventListener("click", () => {
            document.querySelectorAll(".guest-time-tile").forEach((tile) => {
              tile.classList.remove("selected");
              tile.setAttribute("aria-pressed", "false");
            });
            button.classList.add("selected");
            button.setAttribute("aria-pressed", "true");
            document.querySelector('#guest-change-form [name="time"]').value = button.dataset.time;
          });
        });
        document.getElementById("guest-change-form").addEventListener("submit", updateReservation);
        document.getElementById("guest-cancel").addEventListener("click", cancelReservation);
      };

      const load = async () => {
        if (!token) {
          content.innerHTML = '<p class="reservation-message" data-type="error">Reservierung nicht gefunden.</p>';
          return;
        }
        try {
          const data = await api(`/api/guest/reservation?token=${encodeURIComponent(token)}`);
          render(data.reservation);
        } catch (error) {
          content.innerHTML = `<p class="reservation-message" data-type="error">${escapeHtml(error.message)}</p>`;
        }
      };

      const updateReservation = async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const payload = Object.fromEntries(new FormData(form).entries());
        payload.action = "change";
        payload.guests = Number(payload.guests);
        try {
          const data = await api(`/api/guest/reservation?token=${encodeURIComponent(token)}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          render(data.reservation, "Reservierung wurde aktualisiert.");
        } catch (error) {
          document.getElementById("guest-message").textContent = error.message;
          document.getElementById("guest-message").dataset.type = "error";
        }
      };

      const cancelReservation = async () => {
        if (!confirm("Reservierung wirklich stornieren?")) return;
        const data = await api(`/api/guest/reservation?token=${encodeURIComponent(token)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "cancel" }),
        });
        render(data.reservation, "Reservierung wurde storniert.");
      };

      load();
    </script>
  </body>
</html>
