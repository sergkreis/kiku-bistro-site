<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiku Bistro | GГ©rer la rГ©servation</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="../assets/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="../styles.css?v=20260525-lang-menu-1" />
  </head>
  <body class="guest-page">
    <header class="site-header">
      <div class="container header-inner">
        <a class="header-address" href="index.html">
          <span>Kiku Bistro</span>
          <span>RГ©servation</span>
        </a>
        <a class="header-brand" href="index.html" aria-label="Kiku Bistro">
          <img src="../assets/header-flower.png?v=20260428-1" alt="" />
        </a>
        <nav class="nav">
          <a href="index.html">Website</a>
          <a href="index.html#reservation">RГ©server</a>
        </nav>
      </div>
    </header>

    <main class="guest-main">
      <section class="container guest-hero">
        <div>
          <p class="eyebrow">RГ©servation</p>
          <h1>GГ©rer la rГ©servation</h1>
        </div>
        <p>Vous pouvez ici consulter, modifier ou annuler votre rГ©servation.</p>
      </section>

      <section class="container guest-shell">
        <div id="guest-content">
          <p class="admin-muted">Chargement de la rГ©servation...</p>
        </div>
      </section>
    </main>

    <script>
      const content = document.getElementById("guest-content");
      const token = new URLSearchParams(location.search).get("token") || "";
      const slots = ["09:30", "10:00", "11:00", "13:00", "17:00", "18:00"];
      const reservationMinutes = 120;
      const statusLabels = {
        pending: "Demande",
        confirmed: "ConfirmГ©e",
        seated: "Client arrivГ©",
        cancelled: "AnnulГ©e",
        no_show: "Non venu",
      };
      const toLocalDate = (date) => {
        const offset = date.getTimezoneOffset();
        return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 10);
      };
      const escapeHtml = (value) =>
        String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      const closingHeureForDate = (value) => {
        const day = new Date(`${value}T12:00:00`).getDay();
        return day === 3 || day === 0 ? "17:00" : "21:00";
      };
      const slotFitsOpeningHours = (dateValue, timeValue) =>
        new Date(`${dateValue}T${timeValue}:00`).getTime() + reservationMinutes * 60000 <=
        new Date(`${dateValue}T${closingHeureForDate(dateValue)}:00`).getTime();
      const slotsForDate = (dateValue) => slots.filter((slot) => slotFitsOpeningHours(dateValue, slot));
      const api = async (url, options = {}) => {
        const response = await fetch(url, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error((data.errors || ["Erreur"]).join(" "));
        return data;
      };

      const renderHeureTiles = (dateValue, selectedHeure, disabled) =>
        slotsForDate(dateValue)
          .map(
            (slot) => `
              <button class="time-tile guest-time-tile ${slot === selectedHeure ? "selected" : ""}" type="button" data-time="${slot}" ${disabled ? "disabled" : ""} aria-pressed="${slot === selectedHeure}">
                <span class="time-tile-hour">${slot}</span>
              </button>
            `
          )
          .join("");

      const bindHeureTiles = (form) => {
        form.querySelectorAll(".guest-time-tile").forEach((button) => {
          button.addEventListener("click", () => {
            form.querySelectorAll(".guest-time-tile").forEach((tile) => {
              tile.classList.remove("selected");
              tile.setAttribute("aria-pressed", "false");
            });
            button.classList.add("selected");
            button.setAttribute("aria-pressed", "true");
            form.elements.time.value = button.dataset.time;
          });
        });
      };

      const bindDateChange = (form, disabled) => {
        form.elements.date.addEventListener("change", () => {
          const availableSlots = slotsForDate(form.elements.date.value);
          if (!availableSlots.includes(form.elements.time.value)) {
            form.elements.time.value = "";
          }
          form.querySelector(".time-grid").innerHTML = renderHeureTiles(form.elements.date.value, form.elements.time.value, disabled);
          bindHeureTiles(form);
        });
      };

      const render = (reservation, message = "") => {
        const disabled = ["cancelled", "no_show"].includes(reservation.status);
        const status = statusLabels[reservation.status] || reservation.status;
        content.innerHTML = `
          <div class="guest-card">
            <div class="guest-summary">
              <div>
                <span class="guest-status ${reservation.status}">${escapeHtml(status)}</span>
                <h2>${escapeHtml(reservation.date)} Г  ${escapeHtml(reservation.time)}</h2>
                <p>${escapeHtml(reservation.guests)} personnes В· ${escapeHtml(reservation.name)}</p>
              </div>
            </div>

            <form id="guest-change-form" class="guest-form">
              <input type="hidden" name="time" value="${escapeHtml(reservation.time)}" />
              <div class="form-row form-row-two">
                <label><span>Date</span><input type="date" name="date" value="${escapeHtml(reservation.date)}" min="${toLocalDate(new Date())}" ${disabled ? "disabled" : ""} required /></label>
                <label><span>Personnes</span><input type="number" name="guests" min="1" max="12" value="${escapeHtml(reservation.guests)}" ${disabled ? "disabled" : ""} required /></label>
              </div>
              <div class="guest-time-block">
                <span class="guest-label">Heure</span>
                <div class="time-grid">${renderHeureTiles(reservation.date, reservation.time, disabled)}</div>
              </div>
              <label><span>Note</span><textarea name="note" rows="3" ${disabled ? "disabled" : ""}>${escapeHtml(reservation.note)}</textarea></label>
              <div class="guest-actions">
                <button class="btn btn-dark" type="submit" ${disabled ? "disabled" : ""}>Enregistrer les modifications</button>
                <button class="btn btn-outline" type="button" id="guest-cancel" ${disabled ? "disabled" : ""}>Annuler la rГ©servation</button>
              </div>
              <p class="reservation-message" id="guest-message" data-type="${message ? "success" : ""}">${escapeHtml(message)}</p>
            </form>
          </div>
        `;
        const changeForm = document.getElementById("guest-change-form");
        bindHeureTiles(changeForm);
        bindDateChange(changeForm, disabled);
        changeForm.addEventListener("submit", updateRГ©servation);
        document.getElementById("guest-cancel").addEventListener("click", cancelRГ©servation);
      };

      const load = async () => {
        if (!token) {
          content.innerHTML = '<p class="reservation-message" data-type="error">RГ©servation introuvable.</p>';
          return;
        }
        try {
          const data = await api(`/api/guest/reservation?token=${encodeURIComponent(token)}&locale=fr`);
          render(data.reservation);
        } catch (error) {
          content.innerHTML = `<p class="reservation-message" data-type="error">${escapeHtml(error.message)}</p>`;
        }
      };

      const updateRГ©servation = async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const payload = Object.fromEntries(new FormData(form).entries());
        payload.action = "change";
        payload.guests = Number(payload.guests);
        try {
          const data = await api(`/api/guest/reservation?token=${encodeURIComponent(token)}&locale=fr`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          render(data.reservation, "La rГ©servation a Г©tГ© mise Г  jour.");
        } catch (error) {
          document.getElementById("guest-message").textContent = error.message;
          document.getElementById("guest-message").dataset.type = "error";
        }
      };

      const cancelRГ©servation = async () => {
        if (!confirm("Voulez-vous vraiment annuler cette rГ©servation ?")) return;
        const data = await api(`/api/guest/reservation?token=${encodeURIComponent(token)}&locale=fr`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "cancel" }),
        });
        render(data.reservation, "La rГ©servation a Г©tГ© annulГ©e.");
      };

      load();
    </script>
  </body>
</html>
